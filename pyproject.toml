[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-assistant"
version = "0.1.0"
description = "A Python CLI and local web interface for text workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ai-workflow = "ai_workflow.cli:main"
ai-workflow-web = "ai_workflow.web:main"

[tool.setuptools.packages.find]
include = ["ai_workflow*"]

[tool.setuptools.package-data]
ai_workflow = ["web/*"]
